[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-graph-tools"
version = "0.4.0"
description = "Sorry dependency tracker and type signature extractor for Lean 4 projects"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
sorry-graph = "lean_graph.sorry.cli:main"
sig-graph = "lean_graph.sig.cli:main"
downstream-graph = "lean_graph.downstream.cli:downstream_main"
upstream-graph = "lean_graph.downstream.cli:upstream_main"
dep-connected = "lean_graph.downstream.cli:connected_main"

[tool.setuptools.packages.find]
include = ["lean_graph*"]

[tool.setuptools.package-data]
lean_graph = ["lean/*.lean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
